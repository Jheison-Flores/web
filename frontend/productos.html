<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="estilo_producto.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="logo-link">
                <img src="img/Logo-Tienda.png" alt="Logo Tienda de Ropa Moderna" class="logo-img">
            </a>
            <nav>
                <ul class="nav-list">
                    <li><a href="index.html"><i class="bi bi-house-door"></i> Inicio</a></li>
                    <li><a href="productos.html"><i class="bi bi-stars"></i> Novedades</a></li>
                    <li><a href="contacto.html"><i class="bi bi-envelope"></i> Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Modal para mostrar producto ampliado -->
      <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="modalProductoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalProductoLabel"></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body text-center">
              <img id="modalProductoImg" src="" alt="" style="max-width:100%; max-height:400px; border-radius:12px; box-shadow:0 2px 8px rgba(215,38,96,0.13); margin-bottom:18px;">
              <p id="modalProductoDesc"></p>
              <p id="modalProductoPrecio" style="font-size:1.2rem; color:#d72660;"></p>
              <p id="modalProductoTalla" style="color:#a61e4d;"></p>
            </div>
          </div>
        </div>
      </div>
    <main>
      <h2>Catálogo de Productos</h2>
      <div id="productos" class="catalogo-productos"></div>
      <button id="verMasBtn" class="ver-mas-btn" style="display:none;">Ver más productos</button>
    </main>
    <footer>
        <section id="contacto">
            <h2>Contacto</h2>
            <p>Email: elizabethflorespuelles@gmail.com</p>
            <p>Teléfono: +51 918 169 113</p>
        </section>
        <p>&copy; 2025 Novedades Eli. Todos los derechos reservados.</p>
    </footer>
    <script>
      let productosData = [];
      let filasMostradas = 2; // Empieza mostrando 2 filas
      const columnas = 5;

       function renderProductos() {
          const cont = document.getElementById('productos');
          cont.innerHTML = '';
          const totalMostrar = filasMostradas * columnas;
          productosData.slice(0, totalMostrar).forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'producto-card';
            card.style.cursor = 'pointer';
            card.innerHTML = `
              <img src="/uploads/${p.imagen || 'default.jpg'}" alt="Imagen de ${p.nombre}">
              <h3>${p.nombre}</h3>
              <p>${p.descripcion}</p>
              <p><strong>S/${p.precio}</strong></p>
              <p style="color:#d72660;">Talla: ${p.talla}</p>
            `;
            card.addEventListener('click', () => mostrarModalProducto(p));
            cont.appendChild(card);
          });
          // Mostrar u ocultar el botón "Ver más"
          const verMasBtn = document.getElementById('verMasBtn');
          if (productosData.length > totalMostrar) {
            verMasBtn.style.display = 'block';
          } else {
            verMasBtn.style.display = 'none';
          }
        }

      fetch('/api/productos')
        .then(res => res.json())
        .then(data => {
          productosData = data;
          renderProductos();
        });

      document.getElementById('verMasBtn').addEventListener('click', () => {
        filasMostradas += 2; // Muestra 2 filas más
        renderProductos();
      });

      function mostrarModalProducto(producto) {
        document.getElementById('modalProductoLabel').textContent = producto.nombre;
        document.getElementById('modalProductoImg').src = `/uploads/${producto.imagen || 'default.jpg'}`;
        document.getElementById('modalProductoImg').alt = producto.nombre;
        document.getElementById('modalProductoDesc').textContent = producto.descripcion;
        document.getElementById('modalProductoPrecio').textContent = `Precio: S/${producto.precio}`;
        document.getElementById('modalProductoTalla').textContent = `Talla: ${producto.talla}`;
        const modal = new bootstrap.Modal(document.getElementById('modalProducto'));
        modal.show();
      }

      // Inicializar el modal de Bootstrap
      document.addEventListener('DOMContentLoaded', () => {
        const modal = new bootstrap.Modal(document.getElementById('modalProducto'));
        document.getElementById('modalProducto').addEventListener('hidden.bs.modal', () => {
          document.getElementById('modalProductoLabel').textContent = '';
          document.getElementById('modalProductoImg').src = '';
          document.getElementById('modalProductoDesc').textContent = '';
          document.getElementById('modalProductoPrecio').textContent = '';
          document.getElementById('modalProductoTalla').textContent = '';
        });
      });
    </script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <a href="https://wa.me/51918169113" 
      class="whatsapp-float" 
      target="_blank" 
      aria-label="Contactar por WhatsApp">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" 
            alt="WhatsApp" class="whatsapp-icon">
    </a>
</body>
</html>
